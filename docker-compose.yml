version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hubspot_postgres
    environment:
      POSTGRES_DB: hubspot_master_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-20T22-40-07Z
    container_name: hubspot_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  hubspot-master-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hubspot_master_service
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/hubspot_master_service
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_SECURE=false
      - MINIO_BUCKET=hubspot-master-data
      - HMAC_ENABLED=true
      - HMAC_SECRET_KEY_CORE=super-secret-coordinator-key-32-chars-long
      - HMAC_SECRET_KEY_ENGINEER=super-secret-engineer-key-32-chars-long
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
